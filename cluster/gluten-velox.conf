# Gluten 1.5.0 + Velox on CDS 3.2 (Spark 3.2.x) / CDP 7.1.7 SP1
# Read by run-poc.sh and passed as --conf flags. (Don't use --properties-file:
# it replaces CDP's spark-defaults.conf.)
# Put the jar at the same path on every node, or ship it with --jars (see run-poc.sh).

spark.plugins                                   org.apache.gluten.GlutenPlugin
spark.shuffle.manager                           org.apache.spark.shuffle.sort.ColumnarShuffleManager

# Velox runs off-heap. YARN container = executor.memory + memoryOverhead + offHeap.size
# Rule of thumb: give off-heap most of the memory and keep on-heap small.
spark.memory.offHeap.enabled                    true
spark.memory.offHeap.size                       12g
spark.executor.memory                           4g
spark.executor.memoryOverhead                   2g
spark.executor.cores                            4

spark.sql.adaptive.enabled                      true
spark.gluten.sql.columnar.forceShuffledHashJoin true

# Velox reads HDFS through Hadoop's libhdfs.so, loaded at runtime from the CDH parcel.
# Adjust the path if your parcel dir differs (check: ls /opt/cloudera/parcels/CDH/lib64/libhdfs.so)
spark.executorEnv.LD_LIBRARY_PATH               /opt/cloudera/parcels/CDH/lib64:/opt/cloudera/parcels/CDH/lib/hadoop/lib/native
spark.executorEnv.ARROW_LIBHDFS_DIR             /opt/cloudera/parcels/CDH/lib64
spark.yarn.appMasterEnv.LD_LIBRARY_PATH         /opt/cloudera/parcels/CDH/lib64:/opt/cloudera/parcels/CDH/lib/hadoop/lib/native

# Print why an operator fell back to vanilla Spark (check driver log / Spark UI "Gluten" tab)
spark.gluten.sql.columnar.fallbackReporter       true
spark.gluten.ui.enabled                         true

# Uncomment if you run executors on JDK 17 (CDP 7.1.7 normally uses JDK 8 — not needed then)
# spark.executor.extraJavaOptions --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true
# spark.driver.extraJavaOptions   --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true
